
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products | Noor & Barakah</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            background: #f7f4f0;
        }

        .manager-page {
            padding: 45px 7%;
            min-height: 100vh;
        }

        .manager-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .manager-header h1 {
            color: #234d3c;
            font-size: 36px;
            margin-bottom: 8px;
        }

        .manager-header p {
            color: #777;
        }

        .product-form {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.07);
            margin-bottom: 45px;
        }

        .product-form h2 {
            color: #234d3c;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-weight: 600;
        }

        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .input-group textarea {
            height: 100px;
            resize: vertical;
        }

        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            border-color: #234d3c;
        }

        .form-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .save-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #234d3c;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #18392c;
        }

        .cancel-btn {
            padding: 14px 25px;
            border: none;
            border-radius: 25px;
            background: #ddd;
            color: #444;
            cursor: pointer;
            display: none;
        }

        .cancel-btn:hover {
            background: #ccc;
        }

        .products-section {
            max-width: 1100px;
            margin: auto;
        }

        .products-section h2 {
            color: #234d3c;
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
            border: 1px solid #eee;
        }

        .product-card img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #f2f2f2;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            color: #234d3c;
            margin: 0 0 8px;
        }

        .product-price {
            color: #a17c55;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .product-category {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .product-buttons {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .edit-btn {
            background: #edf4ef;
            color: #234d3c;
        }

        .edit-btn:hover {
            background: #234d3c;
            color: white;
        }

        .delete-btn {
            background: #f5e5e5;
            color: #9b5555;
        }

        .delete-btn:hover {
            background: #9b5555;
            color: white;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #234d3c;
            text-decoration: none;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .empty-products {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 18px;
            color: #888;
        }

        @media(max-width:600px) {

            .manager-page {
                padding: 30px 15px;
            }

            .manager-header h1 {
                font-size: 28px;
            }

            .product-form {
                padding: 22px;
            }

            .form-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="manager-page">


    <a href="admin.html" class="back-link">
        ← Back to Owner Dashboard
    </a>


    <div class="manager-header">

        <h1>
            🛍️ Product Manager
        </h1>

        <p>
            Add, edit and remove your Noor & Barakah products
        </p>

    </div>



    <!-- =========================
         PRODUCT FORM
    ========================== -->

    <div class="product-form">

        <h2 id="formTitle">
            ➕ Add New Product
        </h2>


        <div class="input-group">

            <label>
                Product Name
            </label>

            <input
                type="text"
                id="productName"
                placeholder="Example: Custom Resin Frame"
            >

        </div>


        <div class="input-group">

            <label>
                Price
            </label>

            <input
                type="number"
                id="productPrice"
                placeholder="Example: 500"
            >

        </div>


        <div class="input-group">

            <label>
                Category
            </label>

            <select id="productCategory">

                <option value="">
                    Select Category
                </option>

                <option value="Frames">
                    Frames
                </option>

                <option value="Keychains">
                    Keychains
                </option>

                <option value="Bangles">
                    Bangles
                </option>

                <option value="Name Plates">
                    Name Plates
                </option>

                <option value="Jewellery">
                    Jewellery
                </option>

                <option value="Custom">
                    Custom
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <div class="input-group">

            <label>
                Image Path
            </label>

            <input
                type="text"
                id="productImage"
                placeholder="images/products/my-product.jpg"
            >

        </div>


        <div class="input-group">

            <label>
                Description
            </label>

            <textarea
                id="productDescription"
                placeholder="Describe your product..."
            ></textarea>

        </div>


        <div class="form-buttons">

            <button
                class="save-btn"
                id="saveButton"
                onclick="saveProduct()"
            >
                ➕ Add Product
            </button>


            <button
                class="cancel-btn"
                id="cancelButton"
                onclick="cancelEdit()"
            >
                Cancel
            </button>

        </div>

    </div>



    <!-- =========================
         PRODUCTS
    ========================== -->

    <div class="products-section">

        <h2>
            📦 Your Products
        </h2>


        <div
            class="products-grid"
            id="productsGrid"
        >

            <div class="loading">
                Loading products...
            </div>

        </div>

    </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>


<script>


/* =====================================================
   JSON SERVER
===================================================== */

const API_URL = "http://localhost:3000/products";


/* =====================================================
   EDITING PRODUCT ID
===================================================== */

let editingProductId = null;



/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts() {

    const container =
        document.getElementById("productsGrid");


    try {

        const response =
            await axios.get(API_URL);


        const products =
            response.data;


        if (products.length === 0) {

            container.innerHTML = `

                <div class="empty-products">

                    <h3>
                        No products yet
                    </h3>

                    <p>
                        Add your first product above.
                    </p>

                </div>

            `;

            return;

        }


        container.innerHTML = products.map(product => `

            <div class="product-card">

                <img
                    src="${escapeHTML(product.image || '')}"
                    alt="${escapeHTML(product.name || 'Product')}"
                    onerror="this.src='images/hero.jpg'"
                >


                <div class="product-info">

                    <h3>
                        ${escapeHTML(product.name || "Unnamed Product")}
                    </h3>


                    <div class="product-price">
                        ₹${Number(product.price || 0)}
                    </div>


                    <div class="product-category">
                        ${escapeHTML(product.category || "Custom")}
                    </div>


                    <div class="product-buttons">

                        <button
                            class="edit-btn"
                            onclick="editProduct('${product.id}')"
                        >
                            ✏️ Edit
                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteProduct('${product.id}')"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                </div>

            </div>

        `).join("");

    }


    catch(error) {

        console.error(error);

        container.innerHTML = `

            <div class="empty-products">

                <h3>
                    ⚠️ Unable to load products
                </h3>

                <p>
                    Make sure JSON Server is running.
                </p>

                <p>
                    <b>http://localhost:3000</b>
                </p>

            </div>

        `;

    }

}



/* =====================================================
   ADD / UPDATE PRODUCT
===================================================== */

async function saveProduct() {

    const name =
        document
            .getElementById("productName")
            .value
            .trim();


    const price =
        document
            .getElementById("productPrice")
            .value;


    const category =
        document
            .getElementById("productCategory")
            .value;


    const image =
        document
            .getElementById("productImage")
            .value
            .trim();


    const description =
        document
            .getElementById("productDescription")
            .value
            .trim();



    if (!name) {

        alert("Please enter product name.");

        return;

    }


    if (!price) {

        alert("Please enter product price.");

        return;

    }


    if (!category) {

        alert("Please select a category.");

        return;

    }


    if (!image) {

        alert("Please enter image path.");

        return;

    }



    const productData = {

        name: name,

        price: Number(price),

        category: category,

        image: image,

        description: description

    };



    try {


        /* =========================
           EDIT EXISTING PRODUCT
        ========================== */

        if (editingProductId !== null) {

            await axios.patch(

                `${API_URL}/${encodeURIComponent(editingProductId)}`,

                productData

            );


            alert(
                "Product updated successfully! ✅"
            );

        }


        /* =========================
           ADD NEW PRODUCT
        ========================== */

        else {

            await axios.post(

                API_URL,

                productData

            );


            alert(
                "Product added successfully! 🎉"
            );

        }



        clearForm();

        await loadProducts();

    }


    catch(error) {

        console.error(error);

        alert(
            "Something went wrong. Make sure JSON Server is running."
        );

    }

}



/* =====================================================
   EDIT PRODUCT
===================================================== */

async function editProduct(id) {

    try {

        const response =
            await axios.get(

                `${API_URL}/${encodeURIComponent(id)}`

            );


        const product =
            response.data;



        document
            .getElementById("productName")
            .value =
            product.name || "";


        document
            .getElementById("productPrice")
            .value =
            product.price || "";


        document
            .getElementById("productCategory")
            .value =
            product.category || "";


        document
            .getElementById("productImage")
            .value =
            product.image || "";


        document
            .getElementById("productDescription")
            .value =
            product.description || "";



        editingProductId =
            product.id;



        document
            .getElementById("formTitle")
            .innerText =
            "✏️ Edit Product";


        document
            .getElementById("saveButton")
            .innerText =
            "💾 Save Changes";


        document
            .getElementById("cancelButton")
            .style.display =
            "block";



        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    catch(error) {

        console.error(error);

        alert(
            "Unable to open this product for editing."
        );

    }

}



/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id) {

    const confirmDelete =

        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmDelete) {

        return;

    }



    try {

        await axios.delete(

            `${API_URL}/${encodeURIComponent(id)}`

        );


        alert(
            "Product deleted successfully! 🗑️"
        );


        if (
            String(editingProductId) ===
            String(id)
        ) {

            clearForm();

        }


        await loadProducts();

    }


    catch(error) {

        console.error(error);

        alert(
            "Unable to delete product. Make sure JSON Server is running."
        );

    }

}



/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit() {

    clearForm();

}



/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm() {

    document
        .getElementById("productName")
        .value = "";


    document
        .getElementById("productPrice")
        .value = "";


    document
        .getElementById("productCategory")
        .value = "";


    document
        .getElementById("productImage")
        .value = "";


    document
        .getElementById("productDescription")
        .value = "";


    editingProductId = null;


    document
        .getElementById("formTitle")
        .innerText =
        "➕ Add New Product";


    document
        .getElementById("saveButton")
        .innerText =
        "➕ Add Product";


    document
        .getElementById("cancelButton")
        .style.display =
        "none";

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}



/* =====================================================
   START
===================================================== */

loadProducts();


</script>


</body>

</html>
