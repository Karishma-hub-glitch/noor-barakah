
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Login | Noor & Barakah</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .owner-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background:
                linear-gradient(
                    135deg,
                    rgba(35, 77, 60, 0.92),
                    rgba(141, 110, 99, 0.88)
                ),
                url("images/hero.jpg") center/cover no-repeat;
        }

        .owner-card {
            width: 430px;
            max-width: 100%;
            padding: 45px 40px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
        }

        .owner-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #234d3c;
            color: white;
            border-radius: 50%;
            font-size: 34px;
            box-shadow: 0 8px 25px rgba(35, 77, 60, 0.25);
        }

        .owner-card h1 {
            margin: 0;
            color: #234d3c;
            font-size: 30px;
            letter-spacing: 0.5px;
        }

        .owner-card .subtitle {
            margin: 8px 0 30px;
            color: #8d6e63;
            font-size: 14px;
            letter-spacing: 1.5px;
        }

        .owner-card label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            color: #444;
            font-size: 14px;
            font-weight: 600;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            padding: 15px 45px 15px 16px;
            border: 1px solid #ddd;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            background: #fafafa;
            transition: 0.3s;
        }

        .password-wrapper input:focus {
            border-color: #234d3c;
            background: white;
            box-shadow: 0 0 0 4px rgba(35, 77, 60, 0.08);
        }

        .login-button {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border-radius: 14px;
            background: #234d3c;
            color: white;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-button:hover {
            background: #8d6e63;
            transform: translateY(-2px);
        }

        .owner-note {
            margin-top: 22px;
            color: #999;
            font-size: 12px;
        }

        .back-store {
            display: inline-block;
            margin-top: 20px;
            color: #234d3c;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-store:hover {
            color: #8d6e63;
        }

        @media (max-width: 480px) {
            .owner-page {
                padding: 20px;
            }

            .owner-card {
                padding: 35px 25px;
            }

            .owner-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="owner-page">

        <div class="owner-card">

            <div class="owner-icon">
                👑
            </div>

            <h1>Owner Login</h1>

            <p class="subtitle">
                NOOR & BARAKAH RESIN ARTS
            </p>

            <label for="ownerPassword">
                Owner Password
            </label>

            <div class="password-wrapper">
                <input
                    type="password"
                    id="ownerPassword"
                    placeholder="Enter your password"
                    onkeydown="if(event.key === 'Enter') ownerLogin()"
                >
            </div>

            <button
                class="login-button"
                onclick="ownerLogin()"
            >
                Login as Owner
            </button>

            <p class="owner-note">
                🔒 Authorized owner access only
            </p>

            <a
                href="index.html"
                class="back-store"
            >
                ← Back to Store
            </a>

        </div>

    </div>

    <script>
        function ownerLogin() {

            const password =
                document.getElementById("ownerPassword").value;

            const correctPassword = "Noor@1234";

            if (password === correctPassword) {

                window.location.href = "admin.html";

            } else {

                alert("Wrong owner password ❌");

            }
        }
    </script>

</body>
</html>
